name: Check upstream releases

on:
  workflow_dispatch:
  schedule:
    - cron: "45 8 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check pinned upstream releases
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-upstream.py

      - name: Build proposed image
        if: steps.update.outputs.changed == 'true'
        run: |
          docker build \
            --build-arg BUILD_ARCH=amd64 \
            --build-arg BUILD_VERSION="${{ steps.update.outputs.version }}" \
            --build-arg BUILD_NAME="Piper OpenVINO" \
            --build-arg BUILD_DESCRIPTION="Piper text-to-speech with Intel OpenVINO acceleration" \
            --build-arg BUILD_REPOSITORY="${{ github.repository }}" \
            --build-arg BUILD_REF="${{ github.sha }}" \
            piper_openvino

      - name: Open or refresh upstream pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="automation/upstream-updates"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add piper_openvino/config.yaml piper_openvino/Dockerfile piper_openvino/CHANGELOG.md
          git commit -m "Update pinned upstream dependencies"
          git push --force origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Update pinned upstream dependencies" \
            --body "Automated upstream update. The proposed image completed a clean cloud build. Review and merge to publish it to GHCR; Home Assistant installation remains manual." \
            || gh pr edit "$branch" --title "Update pinned upstream dependencies"
